<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Taichi Kayama</title>
  <meta name="description" content="Taichi Kayama の名刺ページ" />
  <style>
    :root{--bg:#0b1020;--fg:#e8eefc;--muted:#a8b3cf;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--btn:rgba(255,255,255,.10)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto;background:radial-gradient(1200px 700px at 20% 10%, #1a2b6a 0%, transparent 60%), var(--bg);color:var(--fg)}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:28px}
    .card{max-width:840px;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:26px}
    h1{margin:0 0 6px;font-size:32px}
    .role{margin:0 0 14px;color:var(--muted)}
    .about{margin:0 0 14px;line-height:1.6}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
    .chip{font-size:13px;color:var(--muted);border:1px solid var(--bd);border-radius:999px;padding:6px 10px;background:rgba(0,0,0,.15)}
    .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
    a.btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--btn);color:var(--fg);text-decoration:none}
    a.btn:hover{filter:brightness(1.12)}
    .meta{margin-top:18px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>Taichi Kayama</h1>
      <p class="role">Solution Engineer (Pre-Sales) / Application Development &amp; Integration</p>

      <p class="about">
        アプリケーション開発・システム統合領域で10年以上、エンジニアリングとアカウント/プロジェクト推進の両面から
        お客様のゴール実現を支援しています。
      </p>

      <div class="chips">
        <span class="chip">Microsoft（2018–）</span>
        <span class="chip">Tokyo, Japan</span>
        <span class="chip">Rikkyo Univ. (Economics)</span>
        <span class="chip">Oracle OpenWorld 2017 Award</span>
      </div>

      <div class="row">
        <a class="btn" href="https://www.linkedin.com/in/taichi-kayama/" target="_blank" rel="noreferrer">LinkedIn</a>
        <a class="btn" href="https://github.com/taichikayama" target="_blank" rel="noreferrer">GitHub</a>
      </div>

      <p class="meta">© <span id="y"></span> Taichi Kayama</p>
    </main>
  </div>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
  </script>
</body>
</html>
